<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="description" content="VaultIPFS — Zero Trust Password Manager">
<title>VaultIPFS — Zero Trust Password Manager</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='4' fill='%230d0d0d'/%3E%3Cpath d='M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z' fill='none' stroke='%2300e5ff' stroke-width='1.5'/%3E%3Cpath d='M9 12l2 2 4-4' fill='none' stroke='%2300e5ff' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E">
<meta name="theme-color" content="#08080a">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- LOADING SCREEN -->
<div id="loading">
  <div class="ld-inner">
    <div class="ld-shield">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <rect x="3" y="11" width="18" height="11" rx="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        <path d="M9 12l2 2 4-4" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="ld-text">
      <h1>VaultIPFS</h1>
      <p>Zero Trust Password Manager</p>
    </div>
    <div class="ld-bar"><div class="ld-bar-i"></div></div>
  </div>
</div>

<!-- MAIN APP -->
<div id="app" style="display:none">
  <div class="overlay" id="overlay"></div>

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sb-top">
      <div class="sb-logo">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <span>VaultIPFS</span>
      </div>
    </div>

    <div class="sb-search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
      <input type="search" placeholder="Search vault...  (Ctrl+K)" id="search">
    </div>

    <button class="btn-primary sb-add" id="btnAdd">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Add New
    </button>

    <nav class="sb-nav">
      <div class="nav-section">
        <div class="nav-label">Overview</div>
        <button class="nav-item active" data-view="all">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <span>All Items</span><span class="nav-count" id="cAll">0</span>
        </button>
        <button class="nav-item" data-view="fav">
          <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          <span>Favorites</span><span class="nav-count" id="cFav">0</span>
        </button>
        <button class="nav-item" data-view="recent">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          <span>Recent</span>
        </button>
        <button class="nav-item" data-view="trash">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
          <span>Trash</span><span class="nav-count" id="cTrash">0</span>
        </button>
      </div>

      <div class="nav-section">
        <div class="nav-label">Types</div>
        <button class="nav-item" data-type="login">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <span>Logins</span><span class="nav-count" id="cTlogin">0</span>
        </button>
        <button class="nav-item" data-type="alias">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <span>Aliases</span><span class="nav-count" id="cTalias">0</span>
        </button>
        <button class="nav-item" data-type="note">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          <span>Notes</span><span class="nav-count" id="cTnote">0</span>
        </button>
        <button class="nav-item" data-type="identity">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <span>Identities</span><span class="nav-count" id="cTidentity">0</span>
        </button>
        <button class="nav-item" data-type="card">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
          <span>Cards</span><span class="nav-count" id="cTcard">0</span>
        </button>
      </div>

      <div class="nav-section" id="folderSection" style="display:none">
        <div class="nav-label" style="display:flex;justify-content:space-between;align-items:center">
          <span>Folders</span>
          <button id="btnNewFolder" style="background:none;border:none;color:var(--accent);cursor:pointer;font-size:16px;padding:2px 6px;border-radius:4px">+</button>
        </div>
        <div id="folderList"></div>
      </div>
    </nav>

    <div class="sb-bottom">
      <button class="nav-item" id="btnHealth">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
        <span>Password Health</span>
      </button>
      <button class="nav-item" id="btnIO">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        <span>Import / Export</span>
      </button>
      <button class="nav-item" id="btnSettings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span>Settings</span>
      </button>
      <div class="sb-divider"></div>
      <button class="nav-item" id="btnLock">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <span>Lock Vault</span>
      </button>
    </div>
  </aside>

  <!-- MAIN CONTENT -->
  <main class="main">
    <header class="header">
      <div class="header-left">
        <button class="menu-btn" id="mobMenu">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <h1 id="viewTitle">All Items</h1>
      </div>
      <div class="header-right">
        <div class="sync-status" id="syncStatus">
          <div class="sync-dot"></div>
          <span>Synced</span>
        </div>
        <button class="theme-btn" id="btnTheme" title="Toggle theme">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
        </button>
      </div>
    </header>
    <div class="body" id="mb"></div>
  </main>
</div>

<!-- MODAL -->
<div class="modal-bg" id="mbg">
  <div class="modal" id="md"></div>
</div>

<!-- TOAST -->
<div class="toast-container" id="tsk"></div>

<!-- CONTEXT MENU -->
<div class="ctx-menu" id="ctxMenu" style="display:none"></div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
